experiment: 00_protocol_calibration
name: labram_default
task: regression
seed: 2025

data:
  train: data/new_validation/r1_r8_train.pkl
  valid: data/new_validation/r9_r10_val.pkl
  test: data/new_validation/r11_test.pkl
  train_dataset:
    module_name: benchmarks.data.regression
    class_name: FixedWindowDataset
    params:
      use_augmentation: false
  valid_dataset:
    module_name: benchmarks.data.regression
    class_name: FixedWindowDataset
    params:
      use_augmentation: false

loaders:
  train:
    batch_size: 720
    shuffle: true
    num_workers: 6
  valid:
    batch_size: 128
    shuffle: false
    num_workers: 6

model:
  module_name: braindecode.models
  class_name: Labram
  params:
    n_chans: 128
    n_outputs: 1
    n_times: 200
    sfreq: 100

optimizer:
  module_name: torch.optim
  class_name: AdamW
  params:
    lr: 0.0003
    weight_decay: 0.01

trainer:
  module_name: benchmarks.pkg.training.trainers
  class_name: RegrTrainer
  n_epochs: 100
  checkpoint:
    input: null
  monitor: nrmse
  minimize: true
  early_stopping_patience: 20
  print_batch_stats: true
  plateau:
    enabled: false
    factor: 0.5
  params:
    mixup_p: 0.0
    mixup_alpha: 0.4
