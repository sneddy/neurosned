experiment: 00_protocol_calibration
name: sneddy_net_stable_bs128_noaug
task: regression
seed: 2025

data:
  train: data/new_validation/r1_r8_train.pkl
  valid: data/new_validation/r9_r10_val.pkl
  test: data/new_validation/r11_test.pkl
  train_dataset:
    module_name: benchmarks.data.regression
    class_name: FixedWindowDataset
    params:
      use_augmentation: false
  valid_dataset:
    module_name: benchmarks.data.regression
    class_name: FixedWindowDataset
    params:
      use_augmentation: false

loaders:
  train:
    batch_size: 128
    shuffle: true
    num_workers: 6
  valid:
    batch_size: 256
    shuffle: false
    num_workers: 6

model:
  module_name: benchmarks.pkg.models.regression.sneddy_net
  class_name: SneddyNet
  params:
    n_chans: 128
    n_times: 200
    sfreq: 100
    n_outputs: 1
    c0: 48
    widen: 2
    depth_per_stage: 3
    dropout: 0.05
    k: 15

optimizer:
  module_name: torch.optim
  class_name: Adam
  params:
    lr: 0.001
    weight_decay: 0

trainer:
  module_name: benchmarks.pkg.training.trainers
  class_name: RegrTrainer
  n_epochs: 100
  checkpoint:
    input: null
  monitor: nrmse
  minimize: true
  early_stopping_patience: 20
  print_batch_stats: true
  plateau:
    enabled: false
    factor: 0.5
  params:
    mixup_p: 0.0
    mixup_alpha: 0.4
