experiment: 02_segmentation_ablations
name: unet_deeper_hazard_event_nll
task: segmentation
seed: 2025

evaluation:
  holdout_eval: true
  holdout_split: test
  save_predictions: true
  save_logits: true
  repeated_runs:
    enabled: false
    seeds: [2025, 2026, 2027, 2028, 2029]
  confidence_interval:
    enabled: true
    method: subject_bootstrap
    n_samples: 1000
    resampling_seed: 2025

data:
  train: data/new_validation/r1_r8_train_5sec.pkl
  valid: data/new_validation/r9_r10_val.pkl
  test: data/new_validation/r11_test.pkl
  train_dataset:
    module_name: benchmarks.data.segmentation
    class_name: TrainCroppingDataset
    params:
      sfreq: 100
      crop_sec: 2.0
      sigma: 0.15
      end_time: 3.0
      use_augmentation: true
      cropping_offset: 0.25
      crop_proba: 0.0
      scale_proba: 0.0
      scale_min: 0.8
      scale_max: 1.2
      dropout_proba: 0.25
      dropout_range: 0.3
      cutout_proba: 0.25
      cutout_min_len: 10
      cutout_max_len: 50
      noise_proba: 0.3
      noise_base_std: 0.01
      noise_random_std: 0.01
  valid_dataset: null

loaders:
  train:
    batch_size: 128
    shuffle: true
    num_workers: 8
  valid:
    batch_size: 256
    shuffle: false
    num_workers: 4

model:
  module_name: benchmarks.pkg.models.segmentation.sneddy_unet
  class_name: SneddySegUNet1D
  params:
    n_chans: 128
    n_times: 200
    sfreq: 100
    c0: 96
    widen: 2
    depth_per_stage: 5
    dropout: 0.2
    k: 15
    out_channels: 1

optimizer:
  module_name: torch.optim
  class_name: Adam
  params:
    lr: 0.001
    weight_decay: 0

trainer:
  module_name: benchmarks.pkg.training.trainers
  class_name: SegmTrainer
  n_epochs: 100
  checkpoint:
    input: null
  monitor: nrmse
  minimize: true
  early_stopping_patience: 20
  print_batch_stats: true
  plateau:
    enabled: false
    factor: 0.5
  params:
    readout_distribution: hazard
    hazard_condition_inside: true
    temperature: 0.65
    eval_temperature: 0.65
    lambda_time: 0.0
    eval_lambda_time: 0.0
    lambda_ce: 0.0
    eval_lambda_ce: 0.0
    lambda_event_nll: 1.0
    eval_lambda_event_nll: 1.0
    event_nll_kernel: gaussian
    lambda_kl: 0.0
    lambda_wass: 0.0
    lambda_entropy: 0.0
    lambda_focal: 0.0
    mixup_p: 0.0
    mixup_alpha: 0.4
    grad_accum: 1
    sigma: 0.15
    use_soft_argmax: true
    plot_last_batch: true

calibration:
  temperature:
    enabled: true
    min: 0.4
    max: 1.8
    step: 0.05
